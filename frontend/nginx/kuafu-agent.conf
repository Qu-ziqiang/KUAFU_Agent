# KUAFUAI 每日 AI 新闻助手 · 前端站点（纯静态 + 反向代理）
# 部署：放到 /etc/nginx/conf.d/kuafu-agent.conf 后 `nginx -t && nginx -s reload`
# 前端零构建，只靠 nginx 托管；后端绑 127.0.0.1:8080，由这里反代。
# 占用端口：3001（避开 22/80/3000）

server {
    listen 3001;
    # 注：不开 IPv6 监听——阿里云轻量多数未启用 IPv6，开了会导致 nginx 起不来
    server_name _;

    # 前端静态资源
    root /opt/kuafu-agent/frontend;
    index index.html;

    # index.html 引用 /static/style.css、/static/app.js
    location /static/ {
        alias /opt/kuafu-agent/frontend/;
        expires 1h;
        add_header Cache-Control "public";
    }

    # 单页兜底（当前为单页表单，保留以防扩展）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反向代理到后端（仅本机，端口不对外）
    location /api/ {
        proxy_pass http://127.0.0.1:8080;   # 无结尾斜杠，保留 /api 前缀转发给后端
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 长连接（生成简报的流式接口）必须的配置
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
        # 关掉缓冲，否则流式内容会被攒着一起发，前端看不到逐条流出
        proxy_buffering off;
        proxy_cache off;
        gzip off;
    }

    # 静态资源压缩（只对 html/css/js，不影响上面的 SSE）
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json;
    gzip_min_length 1024;
    gzip_vary on;
}
